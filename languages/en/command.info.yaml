### Tos command!
tos_title: 'Terms of Service'
tos_header: '> **Terms of Service** — Page %{page}/%{total}'
tos_page1: "### 1. Acceptance & Account\nBy inviting or using **%{bot}** (\"the Bot\"), you agree to these Terms of Service (\"ToS\"). If you do not agree, do not use the Bot.\n\n- These terms apply to all servers, users, and interactions with the Bot.\n- We may update these terms at any time; continued use means acceptance.\n- You must comply with Discord's Terms of Service and Community Guidelines."
tos_page2: "### 2. Data & Privacy\nWe collect and store only the minimum data needed to operate:\n\n- **Guild data:** server ID, configured settings, and prefixes.\n- **Playlists:** saved tracks linked to your user or server.\n- **No private messages** are read or stored.\n\nData is not sold or shared with third parties except as required to provide the service."
tos_page3: "### 3. Usage, Liability & Premium\n- **Usage:** Do not use the Bot for spam, abuse, or any illegal activity.\n- **Availability:** Features may change, break, or be removed at any time without notice.\n- **Liability:** The Bot is provided \"as is\" with no warranty of uptime or accuracy.\n- **Premium:** Purchases are final and non-refundable unless required by law.\n\n*Continued use of %{bot} constitutes acceptance of these terms.*"

