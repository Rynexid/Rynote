### Perintah Tos!
tos_title: 'Ketentuan Layanan'
tos_header: '> **Ketentuan Layanan** — Halaman %{page}/%{total}'
tos_page1: "### 1. Penerimaan & Akun\nDengan mengundang atau menggunakan **%{bot}** (\"Bot\"), kamu menyetujui Ketentuan Layanan (\"ToS\") ini. Jika kamu tidak setuju, jangan gunakan Bot.\n\n- Ketentuan ini berlaku untuk semua server, pengguna, dan interaksi dengan Bot.\n- Kami dapat memperbarui ketentuan ini kapan saja; penggunaan yang berlanjut berarti penerimaan.\n- Kamu harus mematuhi Ketentuan Layanan dan Pedoman Komunitas Discord."
tos_page2: "### 2. Data & Privasi\nKami hanya mengumpulkan dan menyimpan data minimum yang dibutuhkan untuk beroperasi:\n\n- **Data Guild:** ID server, pengaturan, dan prefix.\n- **Playlist:** lagu yang disimpan terkait dengan pengguna atau server kamu.\n- **Tidak ada pesan pribadi** yang dibaca atau disimpan.\n\nData tidak dijual atau dibagikan ke pihak ketiga kecuali diperlukan untuk menyediakan layanan."
tos_page3: "### 3. Penggunaan, Tanggung Jawab & Premium\n- **Penggunaan:** Jangan gunakan Bot untuk spam, penyalahgunaan, atau aktivitas ilegal apa pun.\n- **Ketersediaan:** Fitur dapat berubah, rusak, atau dihapus kapan saja tanpa pemberitahuan.\n- **Tanggung Jawab:** Bot disediakan \"apa adanya\" tanpa jaminan uptime atau akurasi.\n- **Premium:** Pembelian bersifat final dan tidak dapat dikembalikan kecuali diwajibkan oleh hukum.\n\n*Penggunaan %{bot} secara berkelanjutan berarti kamu menerima ketentuan ini.*"

